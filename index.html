<meta name="apple-mobile-web-app-title" content="New Hire Forms">
<meta name="application-name" content="Server Training">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E;
    --red-dim:#a10d25;
    --green:#1B6B3A;
    --ink:#181818;
    --bg:#F6F5F2;
    --card:#FFFFFF;
    --muted:#777777;
    --hair:#ece9e2;
    --card-shadow: 0 2px 12px rgba(20,20,20,0.06), 0 1px 2px rgba(20,20,20,0.05);
    --badge-green-bg:#E3F3E9; --badge-green-fg:#1B6B3A;
    --badge-yellow-bg:#FFF3B0; --badge-yellow-fg:#7A5B00;
    --badge-red-bg:#FDECEA; --badge-red-fg:#C0392B;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    font-size:16px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--red); color:#fff; }
  a{color:inherit;}

  .app{
    max-width:720px;
    margin:0 auto;
    padding:0 0 60px 0;
    min-height:100vh;
    position:relative;
  }

  /* HERO */
  .hero{
    padding:28px 20px 18px;
    position:relative;
    background:var(--card);
    border-bottom:1px solid var(--hair);
    text-align:center;
  }
  .hero::before{ content:none; }
  .eyebrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .home-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--red);
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.04em;
    background:#fff;
    border:none;
    box-shadow:var(--card-shadow);
    border-radius:20px;
    padding:8px 16px;
    text-decoration:none;
  }
  .home-btn:active{ box-shadow:0 1px 4px rgba(20,20,20,0.1); }
  .zazzos-word{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:40px;
    color:var(--red);
    line-height:1;
    margin-bottom:4px;
  }
  h1.brand{
    font-family:'Libre Baskerville', Georgia, serif;
    font-style:normal;
    font-weight:700;
    font-size:22px;
    margin:0 0 4px;
    line-height:1.2;
    color:var(--ink);
  }
  .brand-sub{
    font-family:'Inter', sans-serif;
    font-weight:400;
    font-size:14.5px;
    color:var(--muted);
    margin:0 0 18px;
  }

  .progress-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .slice{
    flex:1;
    height:8px;
    border-radius:99px;

    position:relative;
    overflow:hidden;
  }
  .slice i{

    height:100%;

    transition:width .4s ease;
  }
  .progress-caption{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
    letter-spacing:0.01em;
  }

  /* TABS (top) — persistent, DoorDash-style segmented control */
  .tabbar{
    display:flex;
    gap:6px;
    padding:14px 20px 14px;
    overflow-x:auto;
    scrollbar-width:none;
    background:var(--card);
    border-bottom:1px solid var(--hair);
    position:sticky;
    top:0;
    z-index:5;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbtn{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--bg);
    border:none;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tabbtn:active{ transform:scale(0.96); }

  .tabbtn.active{
    color:#fff;
    background:var(--red);
  }

  .content{ padding:22px 20px 10px; }

  /* DAY SELECTOR */
  .dayrow{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .daybtn{
    flex:1;
    padding:12px 4px;
    border-radius:16px;
    border:none;
    background:var(--card);
    box-shadow:var(--card-shadow);
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .daybtn:active{ transform:scale(0.97); }

  .daybtn b{display:block; font-size:17px; color:var(--ink); font-family:'Libre Baskerville',serif; font-weight:700;}
  .daybtn.active{
    background:var(--red);
    color:#fff;
  }
  .daybtn.active b{color:#fff;}
  .daybtn.done::after{
    content:"✓ done";
    display:block;
    font-size:9.5px;
    margin-top:2px;
    color:var(--green);
    font-weight:700;
  }
  .daybtn.active.done::after{ color:#fff; }

  /* DAY CARD */
  .ticket{
    background:var(--card);
    color:var(--ink);
    border-radius:18px;
    margin-bottom:16px;
    box-shadow:var(--card-shadow);
    position:relative;
    padding:20px 20px 18px;
  }
  .ticket::before{ content:none; }
  .ticket-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--hair);
    padding-bottom:12px;
    margin-bottom:12px;
    gap:10px;
  }
  .ticket-title{
    font-family:'Libre Baskerville', Georgia, serif;
    font-weight:700;
    font-size:19px;
    line-height:1.2;
  }
  .ticket-tag{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--red);
    white-space:nowrap;
  }
  .ticket-obj{
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
    margin-bottom:14px;
    font-style:italic;
    font-family:'Libre Baskerville', Georgia, serif;
  }

  .block{ margin-bottom:16px; }
  .block:last-child{ margin-bottom:0; }
  .block-h{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--red);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .block-h .hrs{
    font-family:'Inter', sans-serif;
    font-weight:500;
    color:var(--muted);
    text-transform:none;
    letter-spacing:0;
  }

  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 4px;
    font-size:14.5px;
    line-height:1.45;
    cursor:pointer;
    border-radius:10px;
  }
  .item:hover{ background:var(--bg); }
  .check{
    flex:0 0 20px;
    width:20px; height:20px;
    border-radius:6px;
    border:1.5px solid var(--hair);
    margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    transition:all .15s ease;
  }
  .check.on{
    background:var(--green);
    border-color:var(--green);
  }
  .check.on::after{
    content:"✓";
    color:#fff;
    font-size:12px;
    font-weight:700;
  }
  .item.done span{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--hair); }

  .callout{
    margin-top:14px;
    padding:14px 16px;
    background:var(--badge-yellow-bg);
    border-radius:14px;
    border-left:none;
    font-size:13.5px;
    line-height:1.55;
    color:var(--badge-yellow-fg);
  }
  .callout b{ color:var(--red-dim); }

  /* Guides / Programs */
  .accordion{
    background:var(--card);
    border:none;
    border-radius:18px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--card-shadow);
  }
  .acc-head{
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    gap:10px;
  }
  .acc-title{
    font-family:'Libre Baskerville', Georgia, serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--ink);
  }
  .acc-meta{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:10px;
    color:var(--red);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .acc-arrow{
    color:var(--muted);
    transition:transform .2s ease;
    flex:0 0 auto;
  }
  .accordion.open .acc-arrow{ transform:rotate(180deg); }
  .acc-body{
    display:none;
    padding:0 18px 18px;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
  }
  .accordion.open .acc-body{ display:block; }
  .acc-body h4{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--green);
    margin:14px 0 6px;
  }
  .acc-body h4:first-child{ margin-top:0; }
  .acc-body ol, .acc-body ul{ margin:0 0 0 18px; padding:0; }
  .acc-body li{ margin-bottom:6px; }
  .acc-body p{ margin-bottom:10px; }
  .acc-body p:last-child{ margin-bottom:0; }
  .acc-body .code{
    font-family:'Inter', sans-serif;
    font-weight:700;
    background:var(--badge-green-bg);
    color:var(--badge-green-fg);
    padding:2px 8px;
    border-radius:6px;
    font-size:13.5px;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:10px 0 14px;
  }
  .stat{
    background:var(--bg);
    border-radius:14px;
    padding:12px 14px;
  }
  .stat .k{ font-family:'Inter',sans-serif; font-weight:700; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
  .stat .v{ font-family:'Libre Baskerville',serif; font-weight:700; font-size:18px; color:var(--green); margin-top:2px;}

  /* Test prep */
  .day-pill-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .pill{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:8px 16px;
    border-radius:999px;
    border:none;
    background:var(--card);
    box-shadow:var(--card-shadow);
    color:var(--muted);
    cursor:pointer;
  }
  .pill:active{ transform:scale(0.97); }

  .pill.active{
    background:var(--red);
    color:#fff;
  }
  .quiz-card{
    background:var(--card);
    color:var(--ink);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:12px;
    box-shadow:var(--card-shadow);
  }
  .quiz-cat{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--red);
    margin-bottom:10px;
    padding-bottom:9px;
    border-bottom:1px solid var(--hair);
  }
  .qrow{ margin-bottom:12px; }
  .qrow:last-child{ margin-bottom:0; }
  .qtext{
    display:flex;
    gap:8px;
    font-size:14px;
    font-weight:600;
    line-height:1.4;
    margin-bottom:7px;
  }
  .qtext .qcheck{
    flex:0 0 18px; width:18px; height:18px;
    border-radius:5px;
    border:1.5px solid var(--hair);
    margin-top:1px;
    cursor:pointer;
    background:#fff;
  }
  .qtext .qcheck.on{ background:var(--green); border-color:var(--green); }
  .qtext .qcheck.on::after{ content:"✓"; color:#fff; font-size:10px; display:block; text-align:center; line-height:15px;}
  .qtext span{ flex:1; }
  textarea.answer{
    width:100%;
    border:1px solid var(--hair);
    background:var(--bg);
    border-radius:10px;
    padding:9px 12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    resize:vertical;
    min-height:36px;
  }
  textarea.answer:focus{ outline:2px solid var(--red); }

  /* bottom tab bar (unused, kept for future use) */
  .bottombar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--card);
    border-top:1px solid var(--hair);
    display:flex;
    max-width:720px;
    margin:0 auto;
    z-index:10;
  }
  .bnav{
    flex:1;
    padding:12px 4px 10px;
    text-align:center;
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:11px;
    cursor:pointer;
  }
  .bnav .ic{ display:block; font-size:18px; margin-bottom:2px; }
  .bnav.active{ color:var(--red); }

  .footnote{
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin:24px 0 0;
    line-height:1.6;
  }

  /* Test tab */
  .score-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--card-shadow);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .score-bar .num{
    font-family:'Libre Baskerville',serif;
    font-weight:700;
    font-size:22px;
    color:var(--green);
  }
  .score-bar .lbl{
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .newset-btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    background:var(--red);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .newset-btn:active{ transform:scale(0.97); }

  .mcq{
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--card-shadow);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .mcq-cat{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--red);
    margin-bottom:8px;
  }
  .mcq-prompt{
    font-family:'Libre Baskerville',serif;
    font-weight:700;
    font-size:15.5px;
    line-height:1.4;
    margin-bottom:12px;
  }
  .mcopt{
    display:block;
    width:100%;
    text-align:left;
    background:var(--card);
    border:none;
    box-shadow:0 1px 4px rgba(20,20,20,0.06);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
  }
  .mcopt:active:not([disabled]){ transform:scale(0.98); }

  .mcopt:last-child{ margin-bottom:0; }
  .mcopt.selected{ box-shadow:0 0 0 2px var(--ink); }
  .mcopt.correct{ background:var(--badge-green-bg); box-shadow:0 0 0 2px var(--green); color:var(--badge-green-fg); font-weight:600; }
  .mcopt.wrong{ background:var(--badge-red-bg); box-shadow:0 0 0 2px var(--red); color:var(--badge-red-fg); }
  .mcopt[disabled]{ cursor:default; }
  .fixed-label{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin:18px 0 8px;
  }

  /* Focused test-link mode */
  .focused-wrap{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .focused-head{
    text-align:center;
    margin-bottom:20px;
  }
  .focused-head h1{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:32px;
    color:var(--red);
    margin:0 0 4px;
  }
  .focused-head .sub{
    font-family:'Inter',sans-serif;
    color:var(--muted);
    font-size:13.5px;
  }
  .gate-card{
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--card-shadow);
    padding:22px 20px;
  }
  .policy-box{
    background:var(--bg);
    border-radius:14px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.6;
    color:var(--ink);
    margin:16px 0;
  }
  .name-input{
    box-sizing:border-box;
    width:100%;
    max-width:100%;
    display:block;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--hair);
    background:#fff;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    margin:0 0 14px;
    accent-color:var(--red);
  }
  .name-input:not([type="date"]){
    -webkit-appearance:none;
    appearance:none;
  }
  .name-input:focus{ outline:2px solid var(--red); }
  .name-input:-webkit-autofill,
  .name-input:-webkit-autofill:hover,
  .name-input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px #fff inset;
    box-shadow:0 0 0 1000px #fff inset;
    transition:background-color 5000s ease-in-out 0s;
  }
  .name-input[type="date"]{ color:var(--ink); box-sizing:border-box; width:100%; max-width:100%; }
  .name-input[type="date"]:invalid, .name-input[type="date"]:required:invalid{ color:var(--muted); }
  .start-btn{
    width:100%;
    padding:14px;
    border-radius:999px;
    border:none;
    background:var(--red);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  .start-btn:active:not(:disabled){ transform:scale(0.97); }

  .start-btn:disabled{ background:var(--hair); color:var(--muted); cursor:not-allowed; }
  .submit-btn{
    width:100%;
    padding:14px;
    border-radius:999px;
    border:none;
    background:var(--green);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
    margin-top:8px;
  }
  .submit-btn:active{ transform:scale(0.97); }

  .end-screen{
    text-align:center;
    padding:40px 20px;
  }
  .end-screen .icon{ font-size:44px; margin-bottom:14px; }
  .end-screen h2{
    font-family:'Libre Baskerville',serif;
    font-size:22px;
    margin:0 0 10px;
  }
  .end-screen p{
    font-size:14.5px;
    line-height:1.6;
    color:var(--muted);
    max-width:400px;
    margin:0 auto;
  }
  .end-screen.fail p{ color:var(--badge-red-fg); }

  .link-box{
    font-family:'Inter',monospace;
    font-size:12.5px;
    background:var(--bg);
    border-radius:8px;
    padding:9px 11px;
    word-break:break-all;
    border:1px solid var(--hair);
    margin-bottom:8px;
  }
  .link-actions{
    display:flex;
    gap:8px;
  }
  .link-actions a, .link-actions button{
    flex:1;
    text-align:center;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:9px 10px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    text-decoration:none;
  }
  .link-preview-btn{ background:var(--bg); color:var(--ink); border:1.5px solid var(--hair) !important; }
  .link-copy-btn{ background:var(--red); color:#fff; }
  .link-copy-btn.copied{ background:var(--green); }

  /* Home screen tiles */
  .home-tiles{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:6px;
  }
  .home-tile{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    box-sizing:border-box;
    text-align:left;
    background:var(--card);
    border:none;
    border-radius:16px;
    padding:16px 18px;
    box-shadow:var(--card-shadow);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;

  .home-tile:active{ transform:scale(0.98); }
  .ht-icon{
    flex:0 0 40px;
    width:40px; height:40px;
    border-radius:50%;
    background:var(--badge-red-bg);
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .ht-body{ flex:1; }
  .ht-title{
    font-family:'Libre Baskerville',serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    margin-bottom:4px;
  }
  .ht-sub{
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--muted);
    line-height:1.4;
    min-height:37px;
    display:flex;
    align-items:center;
  }

  /* Study Guide topic picker */
  .topic-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .topic-tile{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 16px;
    border-radius:999px;
    border:none;
    background:var(--card);
    box-shadow:var(--card-shadow);
    color:var(--muted);
    cursor:pointer;
  }
  .topic-tile:active{ transform:scale(0.97); }
  .topic-tile.on{
    background:var(--red);
    box-shadow:var(--card-shadow);
    color:#fff;
  }

  /* Print documents */
  .print-doc{ font-family:'Inter',sans-serif; font-size:14px; line-height:1.6; color:var(--ink); }
  .print-doc h1,.print-doc h2,.print-doc h3{ color:var(--ink); }

  .print-doc h2{ margin-bottom:6px; }
  .print-doc h3{ margin-bottom:4px; }
  .print-doc p{ margin-bottom:8px; }
  .print-doc ul{ margin:0 0 10px 20px; }
  .print-doc li{ margin-bottom:4px; }
  .print-doc .code{ font-family:'Inter',sans-serif; font-weight:700; }
  @media print{
    .hero, .tabbar, .no-print, .footnote{ display:none !important; }
    body{ background:#fff; }
    .content{ padding:0; }
    .print-doc{ font-size:12px; }
  }

  /* Custom calendar dropdown (replaces native date input) */
  .cal-dropdown{
    background:var(--card);
    border-radius:14px;
    box-shadow:var(--card-shadow);
    padding:14px;
    margin:-8px 0 14px;
  }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-title{
    font-family:'Libre Baskerville',serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
  }
  .cal-nav{
    background:var(--bg);
    border:none;
    border-radius:8px;
    width:32px; height:32px;
    font-size:18px;
    color:var(--red);
    cursor:pointer;
  }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
  }
  .cal-cell{
    aspect-ratio:1;
    border:none;
    background:transparent;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);

(function initFocusedMode(){
  const params = new URLSearchParams(window.location.search);
  const d = parseInt(params.get('day'));
  const s = params.get('study');
  const bt = params.get('btest');
  if(d && TEST_DAY_CONFIG_KEYS_OK(d)){
    focusedMode = true;

    studyMode = true;

    bartenderTestMode = true;

function TEST_DAY_CONFIG_KEYS_OK(d){ return [2,3,4].includes(d); }

const TRAINEE_KEY = 'zazzo-trainee-v1';
let trainee = null; // {id, name, start_date} once signed in
let signInError = null;
let signInDraftName = '';
let signInDraftDate = '';

function loadTrainee(){
  try{
    const raw = localStorage.getItem(TRAINEE_KEY);
    if(raw) trainee = JSON.parse(raw);
  }catch(e){ trainee = null; }
}
function saveTraineeLocal(){
  try{ localStorage.setItem(TRAINEE_KEY, JSON.stringify(trainee)); }catch(e){}
}
async function signInTrainee(name, startDate){
  signInError = null;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/trainees`, {
      method:'POST',
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      },
      body: JSON.stringify({ name: name.trim(), start_date: startDate, role: state.role, status: 'active' })
    });
    if(res.ok){
      const rows = await res.json();
      trainee = { id: rows[0].id, name: rows[0].name, start_date: rows[0].start_date };
      state.tab = 'active-hires';
      state.activeHires = null;
    } else {
      const err = await res.json().catch(()=>({}));
      signInError = err.message || `Sign-in failed (${res.status}). Please try again in a moment.`;
    }
  }catch(e){
    signInError = 'Could not reach the server. Check your connection and try again.';
  }
  render();
}
function signOutTrainee(){
  trainee = null;
  try{ localStorage.removeItem(TRAINEE_KEY); }catch(e){}
  state.tab = 'active-hires';
  render();
}
async function syncTraineeProgress(){
  if(!trainee) return;
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/trainees?id=eq.${trainee.id}`, {
      method:'PATCH',
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body: JSON.stringify({
        checks: state.checks, quiz_checks: state.quizChecks, answers: state.answers,
        updated_at: new Date().toISOString()
      })
    });
  }catch(e){ console.error('progress sync failed', e); }
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
    }
  }catch(e){ /* no saved state yet */ }
  render();
}
async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      checks: state.checks, quizChecks: state.quizChecks, answers: state.answers,
      testSets: state.testSets, testMcAnswers: state.testMcAnswers,
      testFixedChecks: state.testFixedChecks, testFixedAnswers: state.testFixedAnswers
    }));
  }catch(e){ console.error('save failed', e); }
  syncTraineeProgress();
}

const FAKE_TOPPINGS_NOT_OFFERED = ["Anchovies","Feta Cheese","Sun-Dried Tomatoes","Artichoke Hearts","Prosciutto","Truffle Oil","Capers","Arugula"];

function genSpecialtyPizzaQuestion(qIndex){
  const item = SPECIALTY_PIZZAS[qIndex % SPECIALTY_PIZZAS.length];
  const others = SPECIALTY_PIZZAS.filter(p=>p.name!==item.name);
  const decoys = pickRandomN(others,3).map(p=>p.desc);
  const options = shuffleArr([item.desc, ...decoys]);
  return { id:`sp-${qIndex}-${Math.random().toString(36).slice(2,7)}`, cat:'Specialty Pizzas', prompt:`What comes on the ${item.name}?`, options, correct:item.desc };
}
function genPizzaToppingQuestion(qIndex){
  const real = REAL_PIZZA_TOPPINGS[Math.floor(Math.random()*REAL_PIZZA_TOPPINGS.length)];
  const decoys = pickRandomN(FAKE_TOPPINGS_NOT_OFFERED,3);
  const options = shuffleArr([real, ...decoys]);
  return { id:`pt-${qIndex}-${Math.random().toString(36).slice(2,7)}`, cat:'Pizza Toppings', prompt:`If a guest is building their own pizza, which of these is a real topping option?`, options, correct:real };
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickRandomN(arr,n){ return shuffleArr(arr).slice(0,Math.min(n,arr.length)); }

function genDineinQuestion(catName, qIndex){
  const items = MENU_DATA.dinein[catName];
  const item = items[Math.floor(Math.random()*items.length)];
  const useDesc = item.desc && item.desc.length > 8 && Math.random() < 0.6;
  if(useDesc){
    const seenDescs = new Set([item.desc]);
    const others = items.filter(x=>{
      if(x.name===item.name || !x.desc || x.desc.length<=8) return false;
      if(seenDescs.has(x.desc)) return false;
      return true;
    });
    // also dedupe among the candidate pool itself so we never pick two decoys with identical text
    const uniqueOthers = [];
    const localSeen = new Set();
    shuffleArr(others).forEach(o=>{
      if(!localSeen.has(o.desc)){ localSeen.add(o.desc); uniqueOthers.push(o); }
    });
    const decoys = uniqueOthers.slice(0,3).map(d=>d.desc);
    if(decoys.length<3){
      // fall back to membership-style question if not enough distinct decoys
      return genMembershipQuestion(catName, item);
    }
    const options = shuffleArr([item.desc, ...decoys]);
    return { id:`d-${catName}-${qIndex}`, cat:catName, prompt:`What comes with the ${item.name}?`, options, correct:item.desc };
  }
  return genMembershipQuestion(catName, item);
}
function genMembershipQuestion(catName, item){
  const decoyPool = DINEIN_FLAT.filter(x=>x.cat!==catName);
  const decoys = pickRandomN(decoyPool,3).map(d=>d.name);
  const options = shuffleArr([item.name, ...decoys]);
  return { id:`m-${catName}-${item.name}-${Math.random().toString(36).slice(2,7)}`, cat:catName, prompt:`Which of these is one of our current ${catName}?`, options, correct:item.name };
}

function buildStudyDeck(topicIds){
  let deck = [];
  STUDY_TOPICS.filter(t=>topicIds.includes(t.id)).forEach(t=>{
    if(t.kind==='menu' && t.cat==='Pizzas'){
      for(let i=0;i<4;i++){ deck.push(Object.assign({kind:'mc'}, genSpecialtyPizzaQuestion(i))); }
      deck.push(Object.assign({kind:'mc'}, genPizzaToppingQuestion(0)));
    } else if(t.kind==='menu'){
      for(let i=0;i<5;i++){ deck.push(Object.assign({kind:'mc'}, genDineinQuestion(t.cat, i))); }
    } else if(t.kind==='liquorcat'){
      for(let i=0;i<5;i++){ deck.push(Object.assign({kind:'mc'}, genSingleLiquorCatQuestion(t.cat, i))); }
    } else if(t.kind==='specialty'){
      for(let i=0;i<5;i++){ deck.push(Object.assign({kind:'mc'}, genSpecialtyDrinkQuestion(i))); }
    } else {
      const seen = new Set();
      QUIZ.filter(q=>t.quizCats.includes(q.cat)).forEach(entry=>{
        entry.qs.forEach(q=>{
          const key = entry.cat+'|'+q;
          if(!seen.has(key)){
            seen.add(key);
            if(STUDY_ANSWERS[q]){
              deck.push({kind:'reveal', cat:entry.cat, prompt:q, answer:STUDY_ANSWERS[q]});
            }
            // Questions with no real documented answer are left out —
            // showing them with no way to check the answer isn't studying, it's guessing.
          }
        });
      });
    }
  });
  return shuffleArr(deck);
}

function renderCalendarDropdown(){
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
  let selDay=null, selMonth=null, selYear=null;
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(signInDraftDate);
  if(m){ selMonth=parseInt(m[1])-1; selDay=parseInt(m[2]); selYear=parseInt(m[3]); }
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isSel = (selYear===calViewYear && selMonth===calViewMonth && selDay===d);
    cells += `<button type="button" class="cal-cell ${isSel?'selected':''}" data-caldate="${d}">${d}</button>`;
  }
  return `<div class="cal-dropdown">
    <div class="cal-header">
      <button type="button" class="cal-nav" data-calnav="-1">‹</button>
      <div class="cal-title">${monthNames[calViewMonth]} ${calViewYear}</div>
      <button type="button" class="cal-nav" data-calnav="1">›</button>
    </div>
    <div class="cal-weekdays">${['S','M','T','W','T','F','S'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}
function formatDateInput(raw){
  const digits = raw.replace(/\D/g,'').slice(0,8);
  let out = digits;
  if(digits.length > 4) out = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
  else if(digits.length > 2) out = digits.slice(0,2)+'/'+digits.slice(2);
  return out;
}
function isValidDateStr(s){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
  if(!m) return false;
  const mo = parseInt(m[1]), da = parseInt(m[2]), yr = parseInt(m[3]);
  if(mo<1||mo>12||da<1||da>31||yr<2000||yr>2100) return false;
  return true;
}
function dateStrToISO(s){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
  if(!m) return null;
  return `${m[3]}-${m[1]}-${m[2]}`;
}
function isoToDateStr(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');
  if(!m) return iso;
  return `${m[2]}/${m[3]}/${m[1]}`;
}

function attachSignInHandlers(){
  const homeLink = document.getElementById('signin-home-link');
  if(homeLink) homeLink.addEventListener('click', (e)=>{ e.preventDefault(); state.tab='home'; render(); });
  const navHomeLink = document.getElementById('nav-home-link');
  if(navHomeLink) navHomeLink.addEventListener('click', (e)=>{ e.preventDefault(); state.role=null; state.tab='home'; render(); });
  const nameEl = document.getElementById('signin-name');
  const dateBtn = document.getElementById('signin-startdate-btn');
  const btn = document.getElementById('signin-btn');
  nameEl.addEventListener('input', ()=>{
    signInDraftName = nameEl.value;
    btn.disabled = !(nameEl.value.trim() && isValidDateStr(signInDraftDate));
  });
  if(dateBtn){
    dateBtn.addEventListener('click', ()=>{
      if(!calOpen){
        const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(signInDraftDate);
        if(m){ calViewMonth = parseInt(m[1])-1; calViewYear = parseInt(m[3]); }
        else { const now = new Date(); calViewMonth = now.getMonth(); calViewYear = now.getFullYear(); }
      }
      calOpen = !calOpen;
      render();
    });
  }
  document.querySelectorAll('[data-calnav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const dir = parseInt(el.dataset.calnav);
      calViewMonth += dir;
      if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
      if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
      render();
    });
  });
  document.querySelectorAll('[data-caldate]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const day = parseInt(el.dataset.caldate);
      const mm = String(calViewMonth+1).padStart(2,'0');
      const dd = String(day).padStart(2,'0');
      signInDraftDate = `${mm}/${dd}/${calViewYear}`;
      calOpen = false;
      render();
    });
  });
  btn.addEventListener('click', ()=>{
    if(!nameEl.value.trim() || !isValidDateStr(signInDraftDate)) return;
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    signInTrainee(nameEl.value, dateStrToISO(signInDraftDate));
  });
}

    html += `<button class="daybtn ${state.day===dd.n?'active':''} ${isDone?'done':''}" data-day="${dd.n}">

  d.sections.forEach((s,si)=>{
    html += `<div class="block">
      <div class="block-h">${s.h} <span class="hrs">— ${s.hrs}</span></div>`;
    s.items.forEach((it,ii)=>{
      const key = `d${d.n}-${si}-${ii}`;

      html += `<div class="item ${on?'done':''}" data-check="${key}">

  if(d.final){
    html += `<div class="callout"><b>End of Day ${d.n}:</b> ${d.final}</div>`;

  return html;
}

function renderTest(){
  const day = state.testDay || 2;
  if(!state.testSets[day]){ state.testSets[day] = buildTestSet(day); }
  const set = state.testSets[day];
  const cfg = TEST_DAY_CONFIG[day];

  let answered=0, correctCount=0;
  set.mc.forEach(q=>{
    const a = state.testMcAnswers[q.id];
    if(a){ answered++; if(a===q.correct) correctCount++; }
  });

  let html = `<div class="day-pill-row">`;
  [2,3,4].forEach(n=>{
    html += `<button class="pill ${day===n?'active':''}" data-tday="${n}">Day ${n}</button>`;
  });
  html += `</div>`;

  html += `<div class="callout" style="margin-top:0;">
    <b>Send this test:</b> share the link below — it opens straight into this day's test, locked to just that screen.
    <div id="share-link-box" style="font-family:'Inter',monospace; font-size:12.5px; background:#fff; border-radius:8px; padding:8px 10px; margin-top:8px; word-break:break-all; user-select:all;"></div>
  </div>`;

  html += `<div class="score-bar">
    <div>
      <div class="num">${correctCount}/${set.mc.length}</div>
      <div class="lbl">correct · ${answered}/${set.mc.length} answered — this is just your preview, not a submitted result</div>
    </div>
    <button class="newset-btn" data-newset="${day}">New Random Set</button>
  </div>`;

  set.mc.forEach(q=>{
    const selected = state.testMcAnswers[q.id];
    html += `<div class="mcq">
      <div class="mcq-cat">${q.cat}</div>
      <div class="mcq-prompt">${q.prompt}</div>`;
    q.options.forEach(opt=>{
      let cls = 'mcopt';
      if(selected){
        if(opt===q.correct) cls += ' correct';
        else if(opt===selected) cls += ' wrong';
      }
      html += `<button class="${cls}" ${selected?'disabled':''} data-mcanswer="${q.id}" data-mcopt="${encodeURIComponent(opt)}">${opt}</button>`;
    });
    html += `</div>`;
  });

  if(cfg.fixedCats.length){
    html += `<div class="fixed-label">Fixed questions — policies &amp; standards, not menu-item lookups</div>`;
    const cats = QUIZ.filter(q=>q.day===day && cfg.fixedCats.includes(q.cat));
    cats.forEach(cat=>{
      html += `<div class="quiz-card">
        <div class="quiz-cat">${cat.cat}</div>`;
      cat.qs.forEach((q,qi)=>{
        const key = `test-${cat.day}-${cat.cat}-${qi}`;
        const on = !!state.testFixedChecks[key];
        const ans = state.testFixedAnswers[key] || '';
        html += `<div class="qrow">
          <div class="qtext">
            <div class="qcheck ${on?'on':''}" data-tfcheck="${key}"></div>
            <span>${q}</span>
          </div>
          <textarea class="answer" placeholder="Answer…" data-tfanswer="${key}">${ans}</textarea>
        </div>`;
      });
      html += `</div>`;
    });
  }

  return html;
}

function renderResults(){
  if(state.results === null && !state.resultsLoading){
    state.resultsLoading = true;
    fetchResults();
  }

  if(trainee){
    // Scoped to one specific trainee's profile
    const total = totalTaskCount();
    const done = Object.values(state.checks||{}).filter(Boolean).length;
    const pct = total? Math.round((done/total)*100) : 0;
    let html = `<div class="quiz-card" style="margin-bottom:16px;">
      <div class="mcq-prompt" style="margin-bottom:4px;">${escapeHtml(trainee.name)}</div>
      <div style="font-size:13px; color:var(--muted); margin-bottom:8px;">Started ${isoToDateStr(trainee.start_date)}</div>
      <div class="slice" style="height:8px;"><i style="--fill:${pct}%"></i></div>
      <div style="font-size:13px; color:var(--muted); margin-top:6px;">${done}/${total} onboarding tasks · ${pct}%</div>
    </div>`;
    html += `<div class="score-bar" style="margin-bottom:14px;">
      <div><div class="lbl">${escapeHtml(trainee.name)}'s submitted tests</div></div>
      <button class="newset-btn" data-refreshresults="1">Refresh</button>
    </div>`;
    if(state.resultsLoading && state.results === null){
      html += `<div class="ticket-obj" style="padding:0 4px;">Loading submissions…</div>`;
      return html;
    }
    const mine = (state.results||[]).filter(r=>r.trainee_name.trim().toLowerCase() === trainee.name.trim().toLowerCase());
    if(mine.length===0){
      html += `<div class="callout">No submitted tests yet for ${escapeHtml(trainee.name)}. Matched by name typed on the test — if they typed it differently, it won't show up here.</div>`;
      return html;
    }
    mine.forEach(r=>{
      const failed = r.status === 'failed_left_page';
      const when = new Date(r.created_at).toLocaleString();
      const label = (r.role === 'bartender') ? 'Bartender · Specialty Drinks Test' : `Day ${r.day}`;
      html += `<div class="quiz-card">
        <div class="quiz-cat" style="color:${failed?'#C0392B':'#1B6B3A'};">${label} · ${failed?'Failed — left page':'Completed'}</div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:6px;">${when}</div>
        <div style="font-size:14px;"><b>${r.mc_score}/${r.mc_total}</b> correct on multiple choice</div>
        ${failed ? `<div class="callout" style="margin-top:10px;">${escapeHtml(r.fail_reason||'')}</div>` : ''}
      </div>`;
    });
    return html;
  }

  if(state.trainees === undefined || state.trainees === null){
    if(!state.traineesLoading){
      state.traineesLoading = true;
      fetchTrainees();
    }
  }

  let html = `<div class="score-bar" style="margin-bottom:14px;">
    <div><div class="lbl">Trainee progress</div></div>

// Same share-sheet handoff pattern already proven in the real schedule apps —
// works inside a standalone home-screen app where there's no browser chrome at all.
async function shareOrDownloadPDF(url, filename){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    if(navigator.canShare){
      const file = new File([blob], filename + '.pdf', { type: 'application/pdf' });
      if(navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: filename }).catch(()=>{});
        return;
      }
    }
    // Fallback (desktop / older browsers): download the file directly
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = filename + '.pdf';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(objUrl); }, 4000);
  }catch(e){
    console.error('PDF share/download failed', e);
    window.open(url, '_blank');
  }
}

          ${(studySelfCheck.gotIt + studySelfCheck.needsPractice) ? `${studySelfCheck.gotIt} marked "got it," ${studySelfCheck.needsPractice} marked "need more practice."` : ''}
        </p>
        <button class="start-btn" id="study-again-btn" style="margin-top:18px; max-width:300px; margin-left:auto; margin-right:auto;">Study These Again</button>
        <button class="submit-btn" id="study-change-topics-btn" style="margin-top:10px; max-width:300px; margin-left:auto; margin-right:auto; background:var(--ink);">Change Topics</button>
      </div>
    </div>`;
  }

  const card = studyDeck[studyIndex];
  let html = `<div class="focused-wrap">
    <div class="focused-head">
      <h1>Zazzo's</h1>
      <div class="sub">Study Guide — card ${studyIndex+1} of ${studyDeck.length}</div>
    </div>`;

  if(card.kind==='mc'){
    html += `<div class="mcq">
      <div class="mcq-cat">${card.cat}</div>
      <div class="mcq-prompt">${card.prompt}</div>`;
    card.options.forEach(opt=>{
      let cls = 'mcopt';
      if(studyMcAnswer){
        if(opt===card.correct) cls += ' correct';
        else if(opt===studyMcAnswer) cls += ' wrong';
      }
      html += `<button class="${cls}" ${studyMcAnswer?'disabled':''} data-studyopt="${encodeURIComponent(opt)}">${opt}</button>`;
    });
    html += `</div>`;
    if(studyMcAnswer){
      html += `<button class="submit-btn" id="study-next-btn">Next Card</button>`;
    }
  } else if(card.kind==='reveal'){
    html += `<div class="mcq">
      <div class="mcq-cat">${card.cat}</div>
      <div class="mcq-prompt">${card.prompt}</div>
      ${card._revealed ? `<div class="callout" style="margin-top:12px;">${card.answer}</div>` : ''}
    </div>`;
    if(!card._revealed){
      html += `<button class="submit-btn" id="study-reveal-btn">Show Answer</button>`;
    } else if(!card._answered){
      html += `<button class="mcopt" data-selfcheck="gotit" style="text-align:center; font-weight:700; color:var(--badge-green-fg); border-color:var(--green);">I've got this</button>
      <button class="mcopt" data-selfcheck="needs" style="text-align:center; font-weight:700; color:var(--badge-red-fg); border-color:var(--red);">Still need practice</button>`;
    } else {
      html += `<button class="submit-btn" id="study-next-btn">Next Card</button>`;
    }
  }

  html += `</div>`;
  return html;
}

function attachStudyHandlers(){
  document.querySelectorAll('[data-topic]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.topic;
      const i = studySelectedTopics.indexOf(id);
      if(i>=0) studySelectedTopics.splice(i,1); else studySelectedTopics.push(id);
      render();
    });
  });
  const startBtn = document.getElementById('start-study-btn');
  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      if(!studySelectedTopics.length) return;
      studyDeck = buildStudyDeck(studySelectedTopics);
      studyIndex = 0;
      studyMcAnswer = null;
      studyScore = {correct:0, total:0};
      studySelfCheck = {gotIt:0, needsPractice:0};
      render();
    });
  }
  document.querySelectorAll('[data-studyopt]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(studyMcAnswer) return;
      const opt = decodeURIComponent(el.dataset.studyopt);
      const card = studyDeck[studyIndex];
      studyMcAnswer = opt;
      studyScore.total++;
      if(opt===card.correct) studyScore.correct++;
      render();
    });
  });
  const revealBtn = document.getElementById('study-reveal-btn');
  if(revealBtn){
    revealBtn.addEventListener('click', ()=>{
      studyDeck[studyIndex]._revealed = true;
      render();
    });
  }
  document.querySelectorAll('[data-selfcheck]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const card = studyDeck[studyIndex];
      if(card._answered) return;
      card._answered = true;
      if(el.dataset.selfcheck==='gotit') studySelfCheck.gotIt++; else studySelfCheck.needsPractice++;
      render();
    });
  });
  const nextBtn = document.getElementById('study-next-btn');
  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      studyIndex++;
      studyMcAnswer = null;
      render();
    });
  }
  const againBtn = document.getElementById('study-again-btn');
  if(againBtn){
    againBtn.addEventListener('click', ()=>{
      studyDeck = buildStudyDeck(studySelectedTopics);
      studyIndex = 0;
      studyMcAnswer = null;
      studyScore = {correct:0, total:0};
      studySelfCheck = {gotIt:0, needsPractice:0};
      render();
    });
  }
  const changeBtn = document.getElementById('study-change-topics-btn');
  if(changeBtn){
    changeBtn.addEventListener('click', ()=>{
      studyDeck = null;
      render();
    });
  }
}

  document.querySelectorAll('[data-sharepdf]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const original = el.textContent;
      el.disabled = true;
      el.textContent = 'Opening…';
      await shareOrDownloadPDF(el.dataset.sharepdf, el.dataset.sharename);
      el.disabled = false;
      el.textContent = original;
    });
  });
  const secretTarget = document.getElementById('secret-tap-target');
  if(secretTarget){
    secretTarget.addEventListener('click', ()=>{
      secretTapCount++;
      if(secretTapTimer) clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(()=>{ secretTapCount = 0; }, 3000);
      if(secretTapCount >= 6){
        secretTapCount = 0;
        clearTimeout(secretTapTimer);
        state.tab = 'question-bank';
        render();
      }
    });
  }
  document.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.day = parseInt(el.dataset.day); render(); });
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.check;
      state.checks[k] = !state.checks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-acc]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.acc;
      state.openAcc[k] = !state.openAcc[k];
      render();
    });
  });
  document.querySelectorAll('[data-qday]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.quizDay = parseInt(el.dataset.qday); render(); });
  });
  document.querySelectorAll('[data-qcheck]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.qcheck;
      state.quizChecks[k] = !state.quizChecks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-answer]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const k = el.dataset.answer;
      state.answers[k] = el.value;
    });
    el.addEventListener('blur', saveState);
  });

  document.querySelectorAll('[data-tday]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.testDay = parseInt(el.dataset.tday); render(); });
  });
  document.querySelectorAll('[data-newset]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const day = parseInt(el.dataset.newset);
      state.testSets[day] = buildTestSet(day);
      // clear old answers for this day's question ids
      const ids = new Set(state.testSets[day].mc.map(q=>q.id));
      Object.keys(state.testMcAnswers).forEach(k=>{ if(!ids.has(k)) delete state.testMcAnswers[k]; });
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-mcanswer]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qid = el.dataset.mcanswer;
      const opt = decodeURIComponent(el.dataset.mcopt);
      if(state.testMcAnswers[qid]) return; // already answered
      state.testMcAnswers[qid] = opt;
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-tfcheck]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.tfcheck;
      state.testFixedChecks[k] = !state.testFixedChecks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-tfanswer]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const k = el.dataset.tfanswer;
      state.testFixedAnswers[k] = el.value;
    });
    el.addEventListener('blur', saveState);
  });
}

loadTrainee();
loadState();
</script>
</body>
</html>
