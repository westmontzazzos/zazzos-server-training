<meta name="apple-mobile-web-app-title" content="Server Training">
<meta name="application-name" content="Server Training">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E;
    --red-dim:#a10d25;
    --green:#1B6B3A;
    --ink:#181818;
    --bg:#F6F5F2;
    --card:#FFFFFF;
    --muted:#6b6b68;
    --hair:#ece9e2;
    --card-shadow: 0 2px 12px rgba(20,20,20,0.06), 0 1px 2px rgba(20,20,20,0.05);
    --badge-green-bg:#E3F3E9; --badge-green-fg:#1B6B3A;
    --badge-yellow-bg:#FFF3B0; --badge-yellow-fg:#7A5B00;
    --badge-red-bg:#FDECEA; --badge-red-fg:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    font-size:16px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--red); color:#fff; }
  a{color:inherit;}

  .app{
    max-width:720px;
    margin:0 auto;
    padding:0 0 60px 0;
    min-height:100vh;
    position:relative;
  }

  /* HERO */
  .hero{
    padding:28px 20px 18px;
    position:relative;
    background:var(--card);
    border-bottom:1px solid var(--hair);
  }
  .hero::before{ content:none; }
  .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--red);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}
  h1.brand{
    font-family:'Libre Baskerville', Georgia, serif;
    font-style:normal;
    font-weight:700;
    font-size:clamp(32px,8vw,42px);
    margin:8px 0 4px;
    line-height:1.05;
    color:var(--ink);
  }
  .brand-sub{
    font-family:'Inter', sans-serif;
    font-weight:400;
    font-size:14.5px;
    color:var(--muted);
    margin:0 0 18px;
  }

  .progress-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .slice{
    flex:1;
    height:8px;
    border-radius:99px;
    background:var(--hair);
    position:relative;
    overflow:hidden;
  }
  .slice i{
    display:block;
    height:100%;
    width:var(--fill,0%);
    background:var(--green);
    transition:width .4s ease;
  }
  .progress-caption{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-top:8px;

let state = {

(function initFocusedMode(){
  const params = new URLSearchParams(window.location.search);
  const d = parseInt(params.get('day'));
  const p = parseInt(params.get('prep'));
  if(d && TEST_DAY_CONFIG_KEYS_OK(d)){
    focusedMode = true;
    focusedDay = d;
  } else if(p && TEST_DAY_CONFIG_KEYS_OK(p)){
    practiceMode = true;

})();
function TEST_DAY_CONFIG_KEYS_OK(d){ return [2,3,4].includes(d); }

// ---------------- TRAINEE SIGN-IN (main app, not the test-link mode) ----------------
const TRAINEE_KEY = 'zazzo-trainee-v1';
let trainee = null; // {id, name, start_date} once signed in
let signInError = null;
let signInDraftName = '';
let signInDraftDate = '';

function loadTrainee(){
  try{
    const raw = localStorage.getItem(TRAINEE_KEY);
    if(raw) trainee = JSON.parse(raw);
  }catch(e){ trainee = null; }
}
function saveTraineeLocal(){
  try{ localStorage.setItem(TRAINEE_KEY, JSON.stringify(trainee)); }catch(e){}
}
async function signInTrainee(name, startDate){
  signInError = null;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/trainees`, {
      method:'POST',
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      },
      body: JSON.stringify({ name: name.trim(), start_date: startDate })
    });
    if(res.ok){
      const rows = await res.json();
      trainee = { id: rows[0].id, name: rows[0].name, start_date: rows[0].start_date };
      saveTraineeLocal();
    } else {
      const err = await res.json().catch(()=>({}));
      signInError = err.message || `Sign-in failed (${res.status}). Please try again in a moment.`;
    }
  }catch(e){
    signInError = 'Could not reach the server. Check your connection and try again.';
  }
  render();
}
function signOutTrainee(){
  trainee = null;
  try{ localStorage.removeItem(TRAINEE_KEY); }catch(e){}
  render();
}
async function syncTraineeProgress(){
  if(!trainee) return;
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/trainees?id=eq.${trainee.id}`, {
      method:'PATCH',
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body: JSON.stringify({
        checks: state.checks, quiz_checks: state.quizChecks, answers: state.answers,
        updated_at: new Date().toISOString()
      })
    });
  }catch(e){ console.error('progress sync failed', e); }
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
    }
  }catch(e){ /* no saved state yet */ }
  render();
}
async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      checks: state.checks, quizChecks: state.quizChecks, answers: state.answers,
      testSets: state.testSets, testMcAnswers: state.testMcAnswers,
      testFixedChecks: state.testFixedChecks, testFixedAnswers: state.testFixedAnswers
    }));
  }catch(e){ console.error('save failed', e); }
  syncTraineeProgress();
}

const GUIDES = [
{ id:'g1', title:"How to Enter an Order", meta:"POS · Core Flow", body:`
<h4>Step by step</h4>
<ol>
<li>Select the appropriate table number.</li>
<li>Enter the guest's name and phone number (if applicable).</li>
<li>Add drinks — fountain drinks or bar beverages.</li>
<li>Appetizers — input them and press <span class="code">Make Now</span> so they fire immediately.</li>
<li>Soups & salads — enter, then select <span class="code">Make Now</span>.</li>
<li>Entrées & pizzas — enter pastas, sandwiches, dinners, pizzas.</li>
</ol>
<h4>Timing buttons</h4>
<ul>
<li><b>Make with Dinner</b> — multiple entrées (pasta, sandwich, dinner) served together.</li>
<li><b>Make with Pizza</b> — pizza + entrée, so the entrée comes out with the pizza.</li>
</ul>
<h4>Examples</h4>
<ul>
<li>Pasta + Sandwich + Dinner → <span class="code">Make with Dinner</span></li>
<li>Pizza + Pasta or Pizza + Dinner → <span class="code">Make with Pizza</span></li>
</ul>
<h4>Desserts</h4>
<p>Prepared by the server — refer to the red binder at the server station.</p>
<h4>Before finalizing</h4>
<p>Apply any discounts, VIP status, or loyalty rewards.</p>
`},
{ id:'g2', title:"Customer Info & Loyalty Enrollment", meta:"POS · Loyalty", body:`
<h4>Collect</h4>
<ul><li>First and last name</li><li>Phone number</li></ul>
<h4>Steps</h4>
<ol>
<li>Go to the server computer and select the guest's table.</li>
<li>Click the <span class="code">Customer</span> tab.</li>
<li>Enter the phone number — the Customer Information tab appears.</li>
<li>Fill in first and last name.</li>
<li>Click the <span class="code">Zazzo's Customer Loyalty</span> tab (third option, right side).</li>
<li>Click <span class="code">ENROLL</span>.</li>
<li>Close the window — the guest is enrolled and the order is ready to put in.</li>
</ol>
<h4>How the program works</h4>
<div class="stat-grid">
  <div class="stat"><div class="k">Earn rate</div><div class="v">1 pt / $1</div></div>
  <div class="stat"><div class="k">Reward</div><div class="v">$5 per 100 pts</div></div>
</div>
<p>Credits can be used for dine-in, pick-up, or delivery.</p>
<p><b>Example:</b> 1,500 points ÷ 100 = 15 → 15 × $5 = <b>$75 in loyalty credit</b>.</p>
`},
{ id:'g3', title:"Split & Merge Tickets", meta:"POS · Advanced", body:`
<h4>Splitting a ticket</h4>
<ol>
<li>Enter the full order as normal.</li>
<li>Tap <span class="code">Full Review</span> at the bottom.</li>
<li>Click <span class="code">View Tickets</span> (top left, second column).</li>
<li>Click <span class="code">Add Ticket</span> to create a second ticket.</li>
<li>Highlight the item to move — use <span class="code">Multiselect</span> for several at once.</li>
<li>Press <span class="code">Move</span> on the right.</li>
<li>Tap the destination ticket — items transfer over.</li>
<li>Tap <span class="code">Complete All</span> on the left to finish.</li>
</ol>
<h4>Merging tickets</h4>
<ol>
<li>Pull up each table one at a time — note the ticket number at the top of Full Review.</li>
<li>Open the ticket you want to merge from.</li>
<li>In Full Review, click <span class="code">Load Ticket</span> and enter the second ticket number.</li>
<li>Both tickets appear — click the top of the ticket to move.</li>
<li>Click <span class="code">Move</span> on the right.</li>
<li>Tap the ticket everything should move <b>to</b>, then press <span class="code">Complete All</span>.</li>
<li>Close the now-empty ticket. Done — everything's on one ticket.</li>
</ol>
`}
];

const LIQUOR_POOL_CATS = Object.keys(MENU_DATA.liquor);
const DINEIN_CATS = Object.keys(MENU_DATA.dinein);
const DINEIN_FLAT = [];
DINEIN_CATS.forEach(c=> MENU_DATA.dinein[c].forEach(it=> DINEIN_FLAT.push({cat:c, name:it.name})));

// day -> which menu categories become multiple-choice questions, and which QUIZ categories stay fixed
const TEST_DAY_CONFIG = {
  2: { mc:[{label:'Pizzas', source:'dinein', cat:'Pizzas', n:4}, {label:'Appetizers', source:'dinein', cat:'Appetizers', n:4}],
       fixedCats:['Specials','Loyalty Program'] },
  3: { mc:[{label:'Dinners', source:'dinein', cat:'Dinners', n:4}, {label:'Handhelds', source:'dinein', cat:'Handhelds', n:4}],
       fixedCats:[] },
  4: { mc:[{label:'Pastas', source:'dinein', cat:'Pastas', n:4}, {label:'Desserts', source:'dinein', cat:'Desserts', n:3},
           {label:'Salads', source:'dinein', cat:'Salads', n:3}],
       fixedCats:['Soup, Salads & Desserts','Liquor','Coupons & VIP'] }
};

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickRandomN(arr,n){ return shuffleArr(arr).slice(0,Math.min(n,arr.length)); }

function genDineinQuestion(catName, qIndex){
  const items = MENU_DATA.dinein[catName];
  const item = items[Math.floor(Math.random()*items.length)];
  const useDesc = item.desc && item.desc.length > 8 && Math.random() < 0.6;
  if(useDesc){
    const others = items.filter(x=>x.name!==item.name && x.desc && x.desc.length>8);
    const decoys = pickRandomN(others,3).map(d=>d.desc);
    if(decoys.length<3){
      // fall back to membership-style question if not enough decoys
      return genMembershipQuestion(catName, item);
    }
    const options = shuffleArr([item.desc, ...decoys]);
    return { id:`d-${catName}-${qIndex}`, cat:catName, prompt:`What comes with the ${item.name}?`, options, correct:item.desc };
  }
  return genMembershipQuestion(catName, item);
}
function genMembershipQuestion(catName, item){
  const decoyPool = DINEIN_FLAT.filter(x=>x.cat!==catName);
  const decoys = pickRandomN(decoyPool,3).map(d=>d.name);
  const options = shuffleArr([item.name, ...decoys]);
  return { id:`m-${catName}-${item.name}-${Math.random().toString(36).slice(2,7)}`, cat:catName, prompt:`Which of these is one of our current ${catName}?`, options, correct:item.name };
}
function genLiquorQuestion(qIndex){
  const cat = LIQUOR_POOL_CATS[Math.floor(Math.random()*LIQUOR_POOL_CATS.length)];
  const names = MENU_DATA.liquor[cat];
  const name = names[Math.floor(Math.random()*names.length)];
  const otherPool = [];
  LIQUOR_POOL_CATS.forEach(c=>{ if(c!==cat) MENU_DATA.liquor[c].forEach(n=>otherPool.push(n)); });
  const decoys = pickRandomN(otherPool,3);
  const options = shuffleArr([name, ...decoys]);
  return { id:`l-${qIndex}-${Math.random().toString(36).slice(2,7)}`, cat:'Liquor', prompt:`Which of these is one of our current ${cat} options?`, options, correct:name };
}

function buildTestSet(day){
  const cfg = TEST_DAY_CONFIG[day];
  let mc = [];
  cfg.mc.forEach(group=>{
    for(let i=0;i<group.n;i++){
      if(group.source==='liquor') mc.push(genLiquorQuestion(i));
      else mc.push(genDineinQuestion(group.cat, i));
    }
  });
  return { mc };
}

function totalTaskCount(){
  let n=0; DAYS.forEach(d=>d.sections.forEach(s=>n+=s.items.length)); return n;
}
function doneTaskCount(){
  return Object.values(state.checks).filter(Boolean).length;
}
function dayDone(dayN){
  const d = DAYS.find(x=>x.n===dayN);
  let total=0, done=0;
  d.sections.forEach((s,si)=>s.items.forEach((it,ii)=>{
    total++;
    const key = `d${dayN}-${si}-${ii}`;
    if(state.checks[key]) done++;
  }));
  return {total, done};
}

function render(){
  const app = document.getElementById('app');
  if(focusedMode){
    app.innerHTML = renderFocusedTest();
    attachHandlers();
    attachFocusedHandlers();

    attachHandlers();

  const totalTasks = totalTaskCount();

    ${tabBtn('test','Test')}
    ${tabBtn('links','Links')}
    ${tabBtn('results','Results')}

  if(state.tab==='schedule') html += renderSchedule();

function attachSignInHandlers(){
  const nameEl = document.getElementById('signin-name');
  const dateEl = document.getElementById('signin-startdate');
  const btn = document.getElementById('signin-btn');
  function checkReady(){
    signInDraftName = nameEl.value;
    signInDraftDate = dateEl.value;
    btn.disabled = !(nameEl.value.trim() && dateEl.value);
  }
  nameEl.addEventListener('input', checkReady);
  dateEl.addEventListener('input', checkReady);
  btn.addEventListener('click', ()=>{
    if(!nameEl.value.trim() || !dateEl.value) return;
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    signInTrainee(nameEl.value, dateEl.value);
  });
}

function renderTest(){
  const day = state.testDay || 2;
  if(!state.testSets[day]){ state.testSets[day] = buildTestSet(day); }
  const set = state.testSets[day];
  const cfg = TEST_DAY_CONFIG[day];

  let answered=0, correctCount=0;
  set.mc.forEach(q=>{
    const a = state.testMcAnswers[q.id];
    if(a){ answered++; if(a===q.correct) correctCount++; }
  });

  let html = `<div class="day-pill-row">`;
  [2,3,4].forEach(n=>{
    html += `<button class="pill ${day===n?'active':''}" data-tday="${n}">Day ${n}</button>`;
  });
  html += `</div>`;

  html += `<div class="callout" style="margin-top:0;">
    <b>Send this test:</b> share the link below — it opens straight into this day's test, locked to just that screen.
    <div id="share-link-box" style="font-family:'Inter',monospace; font-size:12.5px; background:#fff; border-radius:8px; padding:8px 10px; margin-top:8px; word-break:break-all; user-select:all;"></div>
  </div>`;

  html += `<div class="score-bar">
    <div>
      <div class="num">${correctCount}/${set.mc.length}</div>
      <div class="lbl">correct · ${answered}/${set.mc.length} answered — this is just your preview, not a submitted result</div>
    </div>
    <button class="newset-btn" data-newset="${day}">New Random Set</button>
  </div>`;

  set.mc.forEach(q=>{
    const selected = state.testMcAnswers[q.id];
    html += `<div class="mcq">
      <div class="mcq-cat">${q.cat}</div>
      <div class="mcq-prompt">${q.prompt}</div>`;
    q.options.forEach(opt=>{
      let cls = 'mcopt';
      if(selected){
        if(opt===q.correct) cls += ' correct';
        else if(opt===selected) cls += ' wrong';
      }
      html += `<button class="${cls}" ${selected?'disabled':''} data-mcanswer="${q.id}" data-mcopt="${encodeURIComponent(opt)}">${opt}</button>`;
    });
    html += `</div>`;
  });

  if(cfg.fixedCats.length){
    html += `<div class="fixed-label">Fixed questions — policies &amp; standards, not menu-item lookups</div>`;
    const cats = QUIZ.filter(q=>q.day===day && cfg.fixedCats.includes(q.cat));
    cats.forEach(cat=>{
      html += `<div class="quiz-card">
        <div class="quiz-cat">${cat.cat}</div>`;
      cat.qs.forEach((q,qi)=>{
        const key = `test-${cat.day}-${cat.cat}-${qi}`;
        const on = !!state.testFixedChecks[key];
        const ans = state.testFixedAnswers[key] || '';
        html += `<div class="qrow">
          <div class="qtext">
            <div class="qcheck ${on?'on':''}" data-tfcheck="${key}"></div>
            <span>${q}</span>
          </div>
          <textarea class="answer" placeholder="Answer…" data-tfanswer="${key}">${ans}</textarea>
        </div>`;
      });
      html += `</div>`;
    });
  }

  return html;
}

    fetchResults();
  }
  if(state.trainees === undefined || state.trainees === null){
    if(!state.traineesLoading){
      state.traineesLoading = true;
      fetchTrainees();
    }
  }

  let html = `<div class="score-bar" style="margin-bottom:14px;">
    <div><div class="lbl">Trainee progress</div></div>
    <button class="newset-btn" data-refreshtrainees="1">Refresh</button>
  </div>`;

  if(state.traineesLoading && !state.trainees){
    html += `<div class="ticket-obj" style="padding:0 4px 14px;">Loading trainees…</div>`;
  } else if(!state.trainees || state.trainees.length===0){
    html += `<div class="callout" style="margin-bottom:16px;">No trainees signed in yet.</div>`;
  } else {
    const total = totalTaskCount();
    state.trainees.forEach(t=>{
      const done = Object.values(t.checks||{}).filter(Boolean).length;
      const pct = total? Math.round((done/total)*100) : 0;
      html += `<div class="quiz-card">
        <div class="mcq-prompt" style="margin-bottom:4px;">${escapeHtml(t.name)}</div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:8px;">Started ${t.start_date}</div>
        <div class="slice" style="height:8px;"><i style="--fill:${pct}%"></i></div>
        <div style="font-size:13px; color:var(--muted); margin-top:6px;">${done}/${total} onboarding tasks · ${pct}%</div>
      </div>`;
    });
  }

  html += `<div class="score-bar" style="margin:20px 0 14px;">
    <div><div class="lbl">Submitted tests</div></div>
    <button class="newset-btn" data-refreshresults="1">Refresh</button>
  </div>`;

  if(state.resultsLoading && state.results === null){
    html += `<div class="ticket-obj" style="padding:0 4px;">Loading submissions…</div>`;
    return html;
  }
  if(!state.results || state.results.length===0){
    html += `<div class="callout">No test submissions yet. Once someone completes (or fails) a test through a shared link, it'll show up here.</div>`;
    return html;
  }
  state.results.forEach(r=>{
    const failed = r.status === 'failed_left_page';
    const when = new Date(r.created_at).toLocaleString();
    html += `<div class="quiz-card">
      <div class="quiz-cat" style="color:${failed?'#C0392B':'#1B6B3A'};">Day ${r.day} · ${failed?'Failed — left page':'Completed'}</div>
      <div class="mcq-prompt" style="margin-bottom:4px;">${escapeHtml(r.trainee_name)}</div>
      <div style="font-size:13px; color:var(--muted); margin-bottom:6px;">${when}</div>
      <div style="font-size:14px;"><b>${r.mc_score}/${r.mc_total}</b> correct on multiple choice</div>
      ${failed ? `<div class="callout" style="margin-top:10px;">${escapeHtml(r.fail_reason||'')}</div>` : ''}
    </div>`;
  });
  return html;
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
async function fetchResults(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/test_submissions?select=*&order=created_at.desc&limit=100`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(res.ok){
      state.results = await res.json();
    } else {
      state.results = [];
    }
  }catch(e){
    console.error('fetchResults failed', e);
    state.results = [];
  }
  state.resultsLoading = false;
  if(state.tab==='results') render();
}
async function fetchTrainees(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/trainees?select=*&order=created_at.desc&limit=200`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(res.ok){
      state.trainees = await res.json();
    } else {
      state.trainees = [];
    }
  }catch(e){
    console.error('fetchTrainees failed', e);
    state.trainees = [];
  }
  state.traineesLoading = false;
  if(state.tab==='results') render();
}

function renderLinks(){
  const base = `${window.location.origin}${window.location.pathname}`;
  let html = `<div class="callout" style="margin-top:0;">
    Send trainees the <b>Test</b> link for whichever day they're on. The <b>Practice</b> link is optional — ungraded, no name needed, just study questions. Trainees never see anything else in this app.
  </div>`;
  [2,3,4].forEach(day=>{
    const testUrl = `${base}?day=${day}`;
    const prepUrl = `${base}?prep=${day}`;
    html += `<div class="quiz-card">
      <div class="quiz-cat">Day ${day}</div>
      <div style="font-size:13px; font-weight:700; margin-bottom:4px;">Test (graded, tracked)</div>
      <div class="link-box" data-copylink="${testUrl}">${testUrl}</div>
      <div style="font-size:13px; font-weight:700; margin:12px 0 4px;">Practice (ungraded, optional)</div>
      <div class="link-box" data-copylink="${prepUrl}">${prepUrl}</div>
    </div>`;
  });
  return html;
}

function renderQuiz(){
  const days = [2,3,4];
  let html = `<div class="day-pill-row">`;
  days.forEach(n=>{
    html += `<button class="pill ${state.quizDay===n || (!state.quizDay && n===2)?'active':''}" data-qday="${n}">Day ${n}</button>`;
  });
  html += `</div>`;

  const activeDay = state.quizDay || 2;
  const cats = QUIZ.filter(q=>q.day===activeDay);

  cats.forEach(cat=>{
    html += `<div class="quiz-card">
      <div class="quiz-cat">${cat.cat}</div>`;
    cat.qs.forEach((q,qi)=>{
      const key = `${cat.day}-${cat.cat}-${qi}`;
      const on = !!state.quizChecks[key];
      const ans = state.answers[key] || '';
      html += `<div class="qrow">
        <div class="qtext">
          <div class="qcheck ${on?'on':''}" data-qcheck="${key}"></div>
          <span>${q}</span>
        </div>
        <textarea class="answer" placeholder="Your answer / notes…" data-answer="${key}">${ans}</textarea>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ---------------- PRACTICE LINK (ungraded, no name, no lockdown) ----------------

  const cats = QUIZ.filter(q=>q.day===day);
  let html = `<div class="focused-wrap">
    <div class="focused-head">
      <h1>Zazzo's</h1>
      <div class="sub">Day ${day} Practice — just for studying, not graded</div>
    </div>`;

    html += `<div class="quiz-card">

      html += `<div class="qrow">
        <div class="qtext">
          <div class="qcheck ${on?'on':''}" data-qcheck="${key}"></div>

        <textarea class="answer" placeholder="Your answer / notes…" data-answer="${key}">${ans}</textarea>
      </div>`;

// ---------------- FOCUSED SINGLE-DAY TEST (shared link) ----------------

function renderFocusedTest(){
  const day = focusedDay;

  if(testPhase === 'gate'){
    return `<div class="focused-wrap">
      <div class="focused-head">
        <h1>Zazzo's</h1>
        <div class="sub">Day ${day} Test</div>
      </div>
      <div class="gate-card">
        <div class="ticket-obj" style="margin-bottom:0;">Enter your name to begin.</div>
        <input class="name-input" id="trainee-name-input" type="text" placeholder="Your full name" value="${escapeHtml(traineeName)}" style="margin-top:14px;">
        <div class="policy-box">
          Once you tap "Start Test," please stay on this screen until you submit. If you switch to another app, lock your phone, or open a different tab, the test will end automatically and won't count as completed — so grab a quiet moment before you begin. Good luck!
        </div>
        <button class="start-btn" id="start-test-btn" ${traineeName.trim() ? '' : 'disabled'}>Start Test</button>
      </div>
    </div>`;
  }

  if(testPhase === 'failed'){
    return `<div class="focused-wrap">
      <div class="end-screen fail">
        <div class="icon">🚫</div>
        <h2>Test Session Closed</h2>
        <p>${escapeHtml(state._failReason || '')}</p>
      </div>
    </div>`;
  }

  if(testPhase === 'submitted'){
    return `<div class="focused-wrap">
      <div class="end-screen">
        <div class="icon">✅</div>
        <h2>Test submitted</h2>
        <p>Thanks, ${escapeHtml(traineeName)} — your Day ${day} test has been recorded. You can close this page now.</p>
      </div>
    </div>`;
  }

  // testPhase === 'testing'
  if(!state.testSets[day]) state.testSets[day] = buildTestSet(day);
  const set = state.testSets[day];
  const cfg = TEST_DAY_CONFIG[day];
  let answered=0, correctCount=0;
  set.mc.forEach(q=>{
    const a = state.testMcAnswers[q.id];
    if(a){ answered++; if(a===q.correct) correctCount++; }
  });

  let html = `<div class="focused-wrap">
    <div class="focused-head">
      <h1>Zazzo's</h1>
      <div class="sub">Day ${day} Test — ${escapeHtml(traineeName)}</div>
    </div>`;

  set.mc.forEach(q=>{
    const selected = state.testMcAnswers[q.id];
    html += `<div class="mcq">
      <div class="mcq-cat">${q.cat}</div>
      <div class="mcq-prompt">${q.prompt}</div>`;
    q.options.forEach(opt=>{
      let cls = 'mcopt';
      if(selected){
        if(opt===q.correct) cls += ' correct';
        else if(opt===selected) cls += ' wrong';
      }
      html += `<button class="${cls}" ${selected?'disabled':''} data-mcanswer="${q.id}" data-mcopt="${encodeURIComponent(opt)}">${opt}</button>`;
    });
    html += `</div>`;
  });

  if(cfg.fixedCats.length){
    html += `<div class="fixed-label">Short answer</div>`;
    const cats = QUIZ.filter(q=>q.day===day && cfg.fixedCats.includes(q.cat));
    cats.forEach(cat=>{
      html += `<div class="quiz-card">
        <div class="quiz-cat">${cat.cat}</div>`;
      cat.qs.forEach((q,qi)=>{
        const key = `test-${cat.day}-${cat.cat}-${qi}`;
        const ans = state.testFixedAnswers[key] || '';
        html += `<div class="qrow">
          <div class="qtext"><span>${q}</span></div>
          <textarea class="answer" placeholder="Answer…" data-tfanswer="${key}">${ans}</textarea>
        </div>`;
      });
      html += `</div>`;
    });
  }

  html += `<div class="score-bar" style="margin-top:6px;">
    <div><div class="lbl">${answered}/${set.mc.length} multiple choice answered</div></div>
  </div>
  <button class="submit-btn" id="submit-test-btn">Submit Test</button>
  </div>`;

  return html;
}

async function submitTestResult(status, failReason){
  const day = focusedDay;
  const set = state.testSets[day] || {mc:[]};
  let mcScore = 0;
  set.mc.forEach(q=>{ if(state.testMcAnswers[q.id]===q.correct) mcScore++; });
  const fixedAnswersForDay = {};
  Object.keys(state.testFixedAnswers).forEach(k=>{
    if(k.startsWith(`test-${day}-`)) fixedAnswersForDay[k] = state.testFixedAnswers[k];
  });
  const payload = {
    trainee_name: traineeName.trim(),
    day: day,
    status: status,
    mc_score: mcScore,
    mc_total: set.mc.length,
    mc_answers: state.testMcAnswers,
    fixed_answers: fixedAnswersForDay,
    fail_reason: failReason || null
  };
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/test_submissions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
  }catch(e){ console.error('submit failed', e); }
}

function clearLeaveTimer(){
  if(leaveTimer){ clearTimeout(leaveTimer); leaveTimer = null; }
}
function handleLeavePage(){
  if(testPhase !== 'testing') return;
  if(leaveTimer) return; // already counting down
  leaveTimer = setTimeout(()=>{
    leaveTimer = null;
    if(testPhase !== 'testing') return;
    failTest();
  }, 3000);
}
function handleReturnToPage(){
  clearLeaveTimer();
}
function failTest(){
  testPhase = 'failed';
  state._failReason = `By starting this test, ${traineeName.trim()} acknowledged the policy that this page must remain open and in view for the full duration of the test. That agreement was not upheld, so this test session has been closed and recorded as not completed.`;
  submitTestResult('failed_left_page', state._failReason);
  document.removeEventListener('visibilitychange', onVisibilityChange);
  window.removeEventListener('blur', onWindowBlur);
  window.removeEventListener('focus', onWindowFocus);
  render();
}
function onVisibilityChange(){
  if(document.hidden) handleLeavePage(); else handleReturnToPage();
}
function onWindowBlur(){ handleLeavePage(); }
function onWindowFocus(){ handleReturnToPage(); }

function attachFocusedHandlers(){
  const nameInput = document.getElementById('trainee-name-input');
  if(nameInput){
    nameInput.addEventListener('input', ()=>{
      traineeName = nameInput.value;
      const btn = document.getElementById('start-test-btn');
      if(btn) btn.disabled = !traineeName.trim();
    });
  }
  const startBtn = document.getElementById('start-test-btn');
  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      if(!traineeName.trim()) return;
      state.testSets[focusedDay] = buildTestSet(focusedDay);
      state.testMcAnswers = {};
      testPhase = 'testing';
      document.addEventListener('visibilitychange', onVisibilityChange);
      window.addEventListener('blur', onWindowBlur);
      window.addEventListener('focus', onWindowFocus);
      render();
    });
  }
  document.querySelectorAll('[data-mcanswer]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qid = el.dataset.mcanswer;
      const opt = decodeURIComponent(el.dataset.mcopt);
      if(state.testMcAnswers[qid]) return;
      state.testMcAnswers[qid] = opt;
      render();
    });
  });
  document.querySelectorAll('[data-tfanswer]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.testFixedAnswers[el.dataset.tfanswer] = el.value;
    });
  });
  const submitBtn = document.getElementById('submit-test-btn');
  if(submitBtn){
    submitBtn.addEventListener('click', ()=>{
      clearLeaveTimer();
      document.removeEventListener('visibilitychange', onVisibilityChange);
      window.removeEventListener('blur', onWindowBlur);
      window.removeEventListener('focus', onWindowFocus);
      testPhase = 'submitted';
      submitTestResult('completed', null);
      render();
    });
  }
}

function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; if(state.tab==='results'){ state.results=null; state.trainees=null; } render(); });
  });
  document.querySelectorAll('[data-refreshresults]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.results = null; state.resultsLoading=false; render(); });
  });
  document.querySelectorAll('[data-refreshtrainees]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.trainees = null; state.traineesLoading=false; render(); });
  });
  document.querySelectorAll('[data-copylink]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const url = el.dataset.copylink;
      const done = ()=>{
        const original = el.textContent;
        el.classList.add('copied');
        el.textContent = 'Copied!';
        setTimeout(()=>{ el.classList.remove('copied'); el.textContent = original; }, 1200);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done).catch(()=>{});
      }
    });
  });
  document.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.day = parseInt(el.dataset.day); render(); });
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.check;
      state.checks[k] = !state.checks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-acc]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.acc;
      state.openAcc[k] = !state.openAcc[k];
      render();
    });
  });
  document.querySelectorAll('[data-qday]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.quizDay = parseInt(el.dataset.qday); render(); });
  });
  document.querySelectorAll('[data-qcheck]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.qcheck;
      state.quizChecks[k] = !state.quizChecks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-answer]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const k = el.dataset.answer;
      state.answers[k] = el.value;
    });
    el.addEventListener('blur', saveState);
  });

  document.querySelectorAll('[data-tday]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.testDay = parseInt(el.dataset.tday); render(); });
  });
  document.querySelectorAll('[data-newset]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const day = parseInt(el.dataset.newset);
      state.testSets[day] = buildTestSet(day);
      // clear old answers for this day's question ids
      const ids = new Set(state.testSets[day].mc.map(q=>q.id));
      Object.keys(state.testMcAnswers).forEach(k=>{ if(!ids.has(k)) delete state.testMcAnswers[k]; });
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-mcanswer]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qid = el.dataset.mcanswer;
      const opt = decodeURIComponent(el.dataset.mcopt);
      if(state.testMcAnswers[qid]) return; // already answered
      state.testMcAnswers[qid] = opt;
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-tfcheck]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.tfcheck;
      state.testFixedChecks[k] = !state.testFixedChecks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-tfanswer]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const k = el.dataset.tfanswer;
      state.testFixedAnswers[k] = el.value;
    });
    el.addEventListener('blur', saveState);
  });
}

loadTrainee();
loadState();
</script>
