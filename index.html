<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zazzo's — Server Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E;
    --red-dim:#a10d25;
    --green:#1B6B3A;
    --ink:#181818;
    --bg:#F6F5F2;
    --card:#FFFFFF;
    --muted:#6b6b68;
    --hair:#ece9e2;
    --card-shadow: 0 2px 12px rgba(20,20,20,0.06), 0 1px 2px rgba(20,20,20,0.05);
    --badge-green-bg:#E3F3E9; --badge-green-fg:#1B6B3A;
    --badge-yellow-bg:#FFF3B0; --badge-yellow-fg:#7A5B00;
    --badge-red-bg:#FDECEA; --badge-red-fg:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    font-size:16px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--red); color:#fff; }
  a{color:inherit;}

  .app{
    max-width:720px;
    margin:0 auto;
    padding:0 0 60px 0;
    min-height:100vh;
    position:relative;
  }

  /* HERO */
  .hero{
    padding:28px 20px 18px;
    position:relative;
    background:var(--card);
    border-bottom:1px solid var(--hair);
  }
  .hero::before{ content:none; }
  .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--red);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}
  h1.brand{
    font-family:'Libre Baskerville', Georgia, serif;
    font-style:normal;
    font-weight:700;
    font-size:clamp(32px,8vw,42px);
    margin:8px 0 4px;
    line-height:1.05;
    color:var(--ink);
  }
  .brand-sub{
    font-family:'Inter', sans-serif;
    font-weight:400;
    font-size:14.5px;
    color:var(--muted);
    margin:0 0 18px;
  }

  .progress-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .slice{
    flex:1;
    height:8px;
    border-radius:99px;
    background:var(--hair);
    position:relative;
    overflow:hidden;
  }
  .slice i{
    display:block;
    height:100%;
    width:var(--fill,0%);
    background:var(--green);
    transition:width .4s ease;
  }
  .progress-caption{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
    letter-spacing:0.01em;
  }

  /* TABS (top) — persistent, DoorDash-style segmented control */
  .tabbar{
    display:flex;
    gap:6px;
    padding:14px 20px 14px;
    overflow-x:auto;
    scrollbar-width:none;
    background:var(--card);
    border-bottom:1px solid var(--hair);
    position:sticky;
    top:0;
    z-index:5;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbtn{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--bg);
    border:none;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tabbtn.active{
    color:#fff;
    background:var(--red);
  }

  .content{ padding:18px 20px 10px; }

  /* DAY SELECTOR */
  .dayrow{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .daybtn{
    flex:1;
    padding:12px 4px;
    border-radius:16px;
    border:none;
    background:var(--card);
    box-shadow:var(--card-shadow);
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .daybtn b{display:block; font-size:17px; color:var(--ink); font-family:'Libre Baskerville',serif; font-weight:700;}
  .daybtn.active{
    background:var(--red);
    color:#fff;
  }
  .daybtn.active b{color:#fff;}
  .daybtn.done::after{
    content:"✓ done";
    display:block;
    font-size:9.5px;
    margin-top:2px;
    color:var(--green);
    font-weight:700;
  }
  .daybtn.active.done::after{ color:#fff; }

  /* DAY CARD */
  .ticket{
    background:var(--card);
    color:var(--ink);
    border-radius:18px;
    margin-bottom:16px;
    box-shadow:var(--card-shadow);
    position:relative;
    padding:20px 20px 18px;
  }
  .ticket::before{ content:none; }
  .ticket-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--hair);
    padding-bottom:12px;
    margin-bottom:12px;
    gap:10px;
  }
  .ticket-title{
    font-family:'Libre Baskerville', Georgia, serif;
    font-weight:700;
    font-size:19px;
    line-height:1.2;
  }
  .ticket-tag{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--red);
    white-space:nowrap;
  }
  .ticket-obj{
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
    margin-bottom:14px;
    font-style:italic;
    font-family:'Libre Baskerville', Georgia, serif;
  }

  .block{ margin-bottom:16px; }
  .block:last-child{ margin-bottom:0; }
  .block-h{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--red);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .block-h .hrs{
    font-family:'Inter', sans-serif;
    font-weight:500;
    color:var(--muted);
    text-transform:none;
    letter-spacing:0;
  }

  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 4px;
    font-size:14.5px;
    line-height:1.45;
    cursor:pointer;
    border-radius:10px;
  }
  .item:hover{ background:var(--bg); }
  .check{
    flex:0 0 20px;
    width:20px; height:20px;
    border-radius:6px;
    border:1.5px solid #d5d1c8;
    margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    transition:all .15s ease;
  }
  .check.on{
    background:var(--green);
    border-color:var(--green);
  }
  .check.on::after{
    content:"✓";
    color:#fff;
    font-size:12px;
    font-weight:700;
  }
  .item.done span{ color:var(--muted); text-decoration:line-through; text-decoration-color:#c9c5ba; }

  .callout{
    margin-top:14px;
    padding:14px 16px;
    background:var(--badge-yellow-bg);
    border-radius:14px;
    border-left:none;
    font-size:13.5px;
    line-height:1.55;
    color:#5c4600;
  }
  .callout b{ color:var(--red-dim); }

  /* Guides / Programs */
  .accordion{
    background:var(--card);
    border:none;
    border-radius:18px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--card-shadow);
  }
  .acc-head{
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    gap:10px;
  }
  .acc-title{
    font-family:'Libre Baskerville', Georgia, serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--ink);
  }
  .acc-meta{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:10px;
    color:var(--red);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .acc-arrow{
    color:var(--muted);
    transition:transform .2s ease;
    flex:0 0 auto;
  }
  .accordion.open .acc-arrow{ transform:rotate(180deg); }
  .acc-body{
    display:none;
    padding:0 18px 18px;
    font-size:14.5px;
    line-height:1.65;
    color:#3d3d3b;
  }
  .accordion.open .acc-body{ display:block; }
  .acc-body h4{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--green);
    margin:14px 0 6px;
  }
  .acc-body h4:first-child{ margin-top:0; }
  .acc-body ol, .acc-body ul{ margin:0 0 0 18px; padding:0; }
  .acc-body li{ margin-bottom:6px; }
  .acc-body .code{
    font-family:'Inter', sans-serif;
    font-weight:700;
    background:var(--badge-green-bg);
    color:var(--badge-green-fg);
    padding:2px 8px;
    border-radius:6px;
    font-size:13.5px;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:10px 0 14px;
  }
  .stat{
    background:var(--bg);
    border-radius:14px;
    padding:12px 14px;
  }
  .stat .k{ font-family:'Inter',sans-serif; font-weight:700; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
  .stat .v{ font-family:'Libre Baskerville',serif; font-weight:700; font-size:18px; color:var(--green); margin-top:2px;}

  /* Test prep */
  .day-pill-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .pill{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:8px 16px;
    border-radius:999px;
    border:none;
    background:var(--card);
    box-shadow:var(--card-shadow);
    color:var(--muted);
    cursor:pointer;
  }
  .pill.active{
    background:var(--red);
    color:#fff;
  }
  .quiz-card{
    background:var(--card);
    color:var(--ink);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:12px;
    box-shadow:var(--card-shadow);
  }
  .quiz-cat{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--red);
    margin-bottom:10px;
    padding-bottom:9px;
    border-bottom:1px solid var(--hair);
  }
  .qrow{ margin-bottom:12px; }
  .qrow:last-child{ margin-bottom:0; }
  .qtext{
    display:flex;
    gap:8px;
    font-size:14px;
    font-weight:600;
    line-height:1.4;
    margin-bottom:7px;
  }
  .qtext .qcheck{
    flex:0 0 18px; width:18px; height:18px;
    border-radius:5px;
    border:1.5px solid #d5d1c8;
    margin-top:1px;
    cursor:pointer;
    background:#fff;
  }
  .qtext .qcheck.on{ background:var(--green); border-color:var(--green); }
  .qtext .qcheck.on::after{ content:"✓"; color:#fff; font-size:10px; display:block; text-align:center; line-height:15px;}
  .qtext span{ flex:1; }
  textarea.answer{
    width:100%;
    border:1px solid var(--hair);
    background:var(--bg);
    border-radius:10px;
    padding:9px 12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    resize:vertical;
    min-height:36px;
  }
  textarea.answer:focus{ outline:2px solid var(--red); }

  /* bottom tab bar (unused, kept for future use) */
  .bottombar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--card);
    border-top:1px solid var(--hair);
    display:flex;
    max-width:720px;
    margin:0 auto;
    z-index:10;
  }
  .bnav{
    flex:1;
    padding:12px 4px 10px;
    text-align:center;
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:11px;
    cursor:pointer;
  }
  .bnav .ic{ display:block; font-size:18px; margin-bottom:2px; }
  .bnav.active{ color:var(--red); }

  .footnote{
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin:24px 0 0;
    line-height:1.6;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STORAGE_KEY = 'zazzo-training-progress-v1';
let state = {
  tab: 'schedule',
  day: 1,
  checks: {},   // key -> bool  (day task checklist)
  quizChecks: {}, // key -> bool
  answers: {},  // key -> string
  openAcc: {}   // key -> bool
};

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      state = Object.assign(state, saved);
    }
  }catch(e){ /* no saved state yet */ }
  render();
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      checks: state.checks, quizChecks: state.quizChecks, answers: state.answers
    }));
  }catch(e){ console.error('save failed', e); }
}

// ---------------- RENDER ----------------

function totalTaskCount(){
  let n=0; DAYS.forEach(d=>d.sections.forEach(s=>n+=s.items.length)); return n;
}
function doneTaskCount(){
  return Object.values(state.checks).filter(Boolean).length;
}
function dayDone(dayN){
  const d = DAYS.find(x=>x.n===dayN);
  let total=0, done=0;
  d.sections.forEach((s,si)=>s.items.forEach((it,ii)=>{
    total++;
    const key = `d${dayN}-${si}-${ii}`;
    if(state.checks[key]) done++;
  }));
  return {total, done};
}

function render(){
  const app = document.getElementById('app');
  const totalTasks = totalTaskCount();
  const done = doneTaskCount();
  const overallPct = Math.round((done/totalTasks)*100);

  let html = `
  <div class="hero">
    <div class="eyebrow"><span class="dot"></span>New Hire Onboarding</div>
    <h1 class="brand">Zazzo's</h1>
    <div class="brand-sub">Four-day server training — floor, POS &amp; test prep, all in one place.</div>
    <div class="progress-row">
      ${[1,2,3,4].map(n=>{
        const {total,done:dn} = dayDone(n);
        const pct = total? Math.round((dn/total)*100):0;
        return `<div class="slice"><i style="--fill:${pct}%"></i></div>`;
      }).join('')}
    </div>
    <div class="progress-caption">${done} of ${totalTasks} onboarding tasks checked off · ${overallPct}% complete</div>
  </div>

  <div class="tabbar">
    ${tabBtn('schedule','Schedule')}
    ${tabBtn('guides','POS Guides')}
    ${tabBtn('programs','Programs')}
    ${tabBtn('quiz','Test Prep')}
  </div>

  <div class="content">
  `;

  if(state.tab==='schedule') html += renderSchedule();
  if(state.tab==='guides') html += renderAccordionList(GUIDES);
  if(state.tab==='programs') html += renderAccordionList(PROGRAMS);
  if(state.tab==='quiz') html += renderQuiz();

  html += `</div>
  <div class="footnote">Zazzo's internal training tool · progress saves on this device</div>
  `;

  app.innerHTML = html;
  attachHandlers();
}

function tabBtn(id,label){
  return `<button class="tabbtn ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`;
}

function renderSchedule(){
  const d = DAYS.find(x=>x.n===state.day);
  let html = `<div class="dayrow">`;
  DAYS.forEach(dd=>{
    const {total,done:dn} = dayDone(dd.n);
    const isDone = total>0 && dn===total;
    html += `<button class="daybtn ${state.day===dd.n?'active':''} ${isDone?'done':''}" data-day="${dd.n}">
      <b>Day ${dd.n}</b>${dd.n===state.day?'':''}
    </button>`;
  });
  html += `</div>`;

  html += `<div class="ticket">
    <div class="ticket-head">
      <div class="ticket-title">${d.title}</div>
      <div class="ticket-tag">${d.tag}</div>
    </div>
    <div class="ticket-obj">${d.objective}</div>`;

  d.sections.forEach((s,si)=>{
    html += `<div class="block">
      <div class="block-h">${s.h} <span class="hrs">— ${s.hrs}</span></div>`;
    s.items.forEach((it,ii)=>{
      const key = `d${d.n}-${si}-${ii}`;
      const on = !!state.checks[key];
      html += `<div class="item ${on?'done':''}" data-check="${key}">
        <div class="check ${on?'on':''}"></div><span>${it}</span>
      </div>`;
    });
    html += `</div>`;
  });

  if(d.note){
    html += `<div class="callout">${d.note}</div>`;
  }
  if(d.testPrep){
    html += `<div class="callout"><b>Study for tomorrow's test:</b> ${d.testPrep}</div>`;
  }
  if(d.final){
    html += `<div class="callout"><b>End of Day 4:</b> ${d.final}</div>`;
  }
  html += `</div>`;
  return html;
}

function renderAccordionList(list){
  let html='';
  list.forEach(g=>{
    const open = !!state.openAcc[g.id];
    html += `<div class="accordion ${open?'open':''}" data-acc="${g.id}">
      <div class="acc-head">
        <div>
          <div class="acc-title">${g.title}</div>
          <div class="acc-meta">${g.meta}</div>
        </div>
        <div class="acc-arrow">▾</div>
      </div>
      <div class="acc-body">${g.body}</div>
    </div>`;
  });
  return html;
}

function renderQuiz(){
  const days = [2,3,4];
  let html = `<div class="day-pill-row">`;
  days.forEach(n=>{
    html += `<button class="pill ${state.quizDay===n || (!state.quizDay && n===2)?'active':''}" data-qday="${n}">Day ${n}</button>`;
  });
  html += `</div>`;

  const activeDay = state.quizDay || 2;
  const cats = QUIZ.filter(q=>q.day===activeDay);

  cats.forEach(cat=>{
    html += `<div class="quiz-card">
      <div class="quiz-cat">${cat.cat}</div>`;
    cat.qs.forEach((q,qi)=>{
      const key = `${cat.day}-${cat.cat}-${qi}`;
      const on = !!state.quizChecks[key];
      const ans = state.answers[key] || '';
      html += `<div class="qrow">
        <div class="qtext">
          <div class="qcheck ${on?'on':''}" data-qcheck="${key}"></div>
          <span>${q}</span>
        </div>
        <textarea class="answer" placeholder="Your answer / notes…" data-answer="${key}">${ans}</textarea>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; render(); });
  });
  document.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.day = parseInt(el.dataset.day); render(); });
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.check;
      state.checks[k] = !state.checks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-acc]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.acc;
      state.openAcc[k] = !state.openAcc[k];
      render();
    });
  });
  document.querySelectorAll('[data-qday]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.quizDay = parseInt(el.dataset.qday); render(); });
  });
  document.querySelectorAll('[data-qcheck]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.qcheck;
      state.quizChecks[k] = !state.quizChecks[k];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-answer]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const k = el.dataset.answer;
      state.answers[k] = el.value;
    });
    el.addEventListener('blur', saveState);
  });
}

loadState();
